spring:
  application:
    name: "back-arka-core"

  datasource:
    url: jdbc:postgresql://localhost:5432/arka_db
    username: "postgres"
    password: "1234"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true


server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always